[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "club-migration-lab"
version = "0.1.0"
description = "Real business-derived offline migration stages with explicit verification limits"
requires-python = ">=3.9"

[project.optional-dependencies]
spark = ["pyspark==4.0.1", "pandas==2.2.3", "pyarrow==19.0.1", "openpyxl==3.1.5"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["club_migration*"]
